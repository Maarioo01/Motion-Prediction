services:
  qcnet:
    build: ./repos/QCNet
    image: motion-prediction/qcnet:latest
    container_name: qcnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/QCNet:/workspace
      - /raid/argoverse2/motion_forecasting:/data/argoverse2:ro
      - /raid/scratch/qcnet_data_staging:/workspace/data_staging
    working_dir: /workspace
    stdin_open: true
    tty: true

  cmp:
    build: ./repos/CMP
    image: motion-prediction/cmp:latest
    container_name: cmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/CMP:/workspace
      - /raid/datasets/V2V4Real:/data/v2v4real:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  v2x-graph:
    build: ./repos/V2X-Graph
    image: motion-prediction/v2x-graph:latest
    container_name: v2x-graph
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    environment:
      # dair_map_api reads $DATA_ROOT/map_files at import time (TFD layout from
      # prepare_tfd_layout.sh; use /data/v2x-traj for V2X-Traj).
      - DATA_ROOT=/workspace/data_staging/tfd
    volumes:
      - ./repos/V2X-Graph:/workspace
      - ./repos/DAIR-V2X-Seq:/deps/DAIR-V2X-Seq:ro
      - /raid/datasets/V2X-Seq-TFD/V2X-Seq-TFD:/data/v2x-seq-tfd:ro
      - /raid/datasets/V2X-Traj/v2x-traj:/data/v2x-traj:ro
      - /raid/scratch/v2xgraph_data:/workspace/data_staging
    working_dir: /workspace
    stdin_open: true
    tty: true
