services:
  qcnet:
    build: ./repos/QCNet
    image: motion-prediction/qcnet:latest
    container_name: qcnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/QCNet:/workspace
      - /raid/argoverse2/motion_forecasting:/data/argoverse2:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  realmotion:
