# GPU selection: one card per container, chosen with the GPU variable.
#   GPU 0 = RTX 3090 (24 GB), GPU 1 = RTX 5090 (32 GB)   (nvidia-smi order)
#   docker compose run --rm v2x-graph-cu128            # default card of that service
#   GPU=0 docker compose run --rm v2x-graph-cu128      # explicit
# The original images (old CUDA 11.x torch) can only run on the 3090; they are pinned to
# GPU 0. The *-cu128 services (torch built for CUDA 12.8) run on either card and default
# to the 5090. Never use `gpus: all`: one experiment per card (README, "GPU allocation").
x-gpu-3090-only: &gpu-3090-only
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["0"]
          capabilities: ["gpu"]
# Docker's default soft limit of 1024 open files is too low for DataLoader workers passing
# graph tensors ("received 0 items of ancdata" / "Too many open files", then a hang).
x-nofile: &nofile
  nofile:
    soft: 65536
    hard: 524288
x-gpu-any: &gpu-any
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["${GPU:-1}"]
          capabilities: ["gpu"]

services:
  qcnet: &qcnet
    build: ./repos/QCNet
    image: motion-prediction/qcnet:latest
    container_name: qcnet
    deploy: *gpu-3090-only
    ipc: host
    ulimits: *nofile
    volumes:
      - ./repos/QCNet:/workspace
      - /raid/argoverse2/motion_forecasting:/data/argoverse2:ro
      - /raid/scratch/qcnet_data_staging:/workspace/data_staging
    working_dir: /workspace
    stdin_open: true
    tty: true

  cmp:
    build: ./repos/CMP
    image: motion-prediction/cmp:latest
    container_name: cmp
    deploy: *gpu-3090-only
    ipc: host
    ulimits: *nofile
    volumes:
      - ./repos/CMP:/workspace
      - /raid/datasets/V2V4Real:/data/v2v4real:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  v2x-graph: &v2x-graph
    build: ./repos/V2X-Graph
    image: motion-prediction/v2x-graph:latest
    container_name: v2x-graph
    deploy: *gpu-3090-only
    ipc: host
    ulimits: *nofile
    environment:
      # dair_map_api reads $DATA_ROOT/map_files at import time (TFD layout from
      # prepare_tfd_layout.sh; use /data/v2x-traj for V2X-Traj).
      - DATA_ROOT=/workspace/data_staging/tfd
    volumes:
      - ./repos/V2X-Graph:/workspace
      - ./repos/DAIR-V2X-Seq:/deps/DAIR-V2X-Seq:ro
      - /raid/datasets/V2X-Seq-TFD/V2X-Seq-TFD:/data/v2x-seq-tfd:ro
      - /raid/datasets/V2X-Traj/v2x-traj:/data/v2x-traj:ro
      - /raid/scratch/v2xgraph_data:/workspace/data_staging
      # Training graph files live on the NVMe (the HDD cannot feed training once patch 0004 is in);
      # the train/processed folders under /raid are symlinks to this same absolute path.
      - /home/baco/nvme_cache:/home/baco/nvme_cache:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Same code, mounts and data as v2x-graph; torch 2.7.1+cu128 (docker/V2X-Graph/Dockerfile.cu128).
  v2x-graph-cu128:
    <<: *v2x-graph
    build:
      context: ./repos/V2X-Graph
      dockerfile: Dockerfile.cu128
    image: motion-prediction/v2x-graph:cu128
    container_name: v2x-graph-cu128
    deploy: *gpu-any

  # HiVT baseline of the V2X-Seq authors (DAIR-V2X-Seq projects/HiVT_plugin, checklist B5/C1).
  # V2X-Graph is built on HiVT and needs the same stack (torch, PyG, PL 1.x, argoverse-api),
  # so this reuses the v2x-graph cu128 image: build v2x-graph-cu128 first. Runs on either card.
  hivt-cu128:
    image: motion-prediction/v2x-graph:cu128
    container_name: hivt-cu128
    deploy: *gpu-any
    ipc: host
    ulimits: *nofile
    environment:
      - DATA_ROOT=/workspace/data_staging/tfd      # dair_map_api reads $DATA_ROOT/map_files
      - PYTHONPATH=/workspace/projects/dataset
    volumes:
      - ./repos/DAIR-V2X-Seq:/workspace
      - ./docker/V2X-Graph/extras:/bench-extras:ro  # prepare_tfd_layout.sh (same TFD layout)
      - /raid/datasets/V2X-Seq-TFD/V2X-Seq-TFD:/data/v2x-seq-tfd:ro
      - /raid/scratch/hivt_data:/workspace/data_staging
    working_dir: /workspace/projects/HiVT_plugin
    stdin_open: true
    tty: true

  # Same code, mounts and data as qcnet; torch 2.7.1+cu128 (docker/QCNet/Dockerfile.cu128).
  qcnet-cu128:
    <<: *qcnet
    build:
      context: ./repos/QCNet
      dockerfile: Dockerfile.cu128
    image: motion-prediction/qcnet:cu128
    container_name: qcnet-cu128
    deploy: *gpu-any
