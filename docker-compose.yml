services:
  qcnet:
    build: ./repos/QCNet
    image: motion-prediction/qcnet:latest
    container_name: qcnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/QCNet:/workspace
      - /raid/argoverse2/motion_forecasting:/data/argoverse2:ro
      - /raid/scratch/qcnet_data_staging:/workspace/data_staging
    working_dir: /workspace
    stdin_open: true
    tty: true

  cmp:
    build: ./repos/CMP
    image: motion-prediction/cmp:latest
    container_name: cmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/CMP:/workspace
      - /raid/datasets/V2V4Real:/data/v2v4real:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
