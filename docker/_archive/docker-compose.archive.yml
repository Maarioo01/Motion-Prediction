      - /raid/argoverse2/motion_forecasting:/data/argoverse2:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  pretraining-synthetic:
    build: ./repos/pretraining-synthetic
    image: motion-prediction/pretraining-synthetic:latest
    container_name: pretraining-synthetic
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/pretraining-synthetic:/workspace
      - /raid/argoverse1_1/motion_forecasting:/data/argoverse1:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  gameformer:
    build: ./repos/GameFormer
    image: motion-prediction/gameformer:latest
    container_name: gameformer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
