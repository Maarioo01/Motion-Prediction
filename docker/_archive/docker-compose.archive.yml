              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/MTR:/workspace
      - /raid/waymo:/data/waymo:ro
      - /raid/scratch/mtr_data_staging:/workspace/data_staging
    working_dir: /workspace
    stdin_open: true
    tty: true

  emp:
    build: ./repos/emp
    image: motion-prediction/emp:latest
    container_name: emp
    deploy:
      resources:
        reservations:
          devices:
