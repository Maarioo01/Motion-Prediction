            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    ipc: host
    volumes:
      - ./repos/UniTraj:/workspace
      - /raid/waymo:/data/waymo:ro
      - /raid/nuscenes:/data/nuscenes:ro
      - /raid/argoverse2:/data/argoverse2:ro
